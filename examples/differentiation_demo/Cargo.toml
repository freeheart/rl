[package]
name = "differentiation_demo"
version = "0.1.0"
edition = "2021"
authors = ["Jinzhu.Zhang <freeheart1977@example.com>"]
description = "RL差异化特性演示"
license = "MIT"

[[bin]]
name = "differentiation_demo"
path = "src/main.rs"

[dependencies]
rl = { path = "../.." }
tokio = { version = "1.0", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
parking_lot = "0.12"
petgraph = "0.6"
num_cpus = "1.0"
thiserror = "1.0"

